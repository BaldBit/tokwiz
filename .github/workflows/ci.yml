name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-benchmark:
    name: Test & Benchmark (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Tier 1–4 Unit, Hook Contract & Reconciliation Tests
        run: python -m unittest discover -s tests -v

      - name: Verify SKILL.md Token Budget & CLI Commands
        run: |
          tokwiz graph build
          tokwiz graph query ProjectGraph --max-tokens 250
          tokwiz skeleton scripts/project-graph.py --max-tokens 150
          tokwiz predict "Refactor ProjectGraph query to support custom PageRank damping"

      - name: Run Paired A/B Benchmark Suite Gate
        run: tokwiz benchmark
