[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tokwiz"
version = "0.2.0"
description = "Cross-agent token optimization layer, Tier 2 codebase graph, and pre-prompt cost forecaster"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
treesitter = [
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.4.0",
]
tokenizer = [
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
tokwiz = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
